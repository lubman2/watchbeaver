# Konfigurace WatchBeaver — Watchdog úředních desek (Zeleneč & okolí)

keywords:
  - '(?i)\bzeleneč\w*'
  - '(?i)\bzelenec\w*'
  - '(?i)\bmstětic\w*'
  - '(?i)\bmstetic\w*'
  - '792756' # Kód k.ú. Zeleneč

notifications:
  telegram:
    enabled: true
  email:
    enabled: true
    recipient: "romanxdolezal@seznam.cz"
    cc: ["lubos.soustruznik@myflow.cz"]
    sender_name: "Klára virtuální asistentka Luboše S."
    sender_email: "klara.superzelva@gmail.com"

